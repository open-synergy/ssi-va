options:
  auto_refresh: true

setup:
  steps:
    - step: "Get ir.model record for res.partner"
      action: "ref"
      xml_id: "base.model_res_partner"
      save_as: "model_res_partner"

    - step: "Create bank A"
      action: "create"
      model: "res.bank"
      save_as: "bank_a"
      values:
        name: "Bank A"

scenarios:
  - name:
      "Wizard on a single partner creates one va_generator with one source data line"
    steps:
      - step: "Create generator type"
        action: "create"
        model: "va_generator_type"
        save_as: "generator_type"
        values:
          name: "Sequence Based"
          code: "/"
          python_code: 'result = "U1"'
      - step: "Create biller"
        action: "create"
        model: "va_biller"
        save_as: "biller"
        values:
          name: "Biller A"
          code: "/"
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Partner"
      - step: "Run wizard on the partner (as if launched from Contact list)"
        action: "wizard"
        model: "generate_va"
        target: "partner"
        values:
          type_id: "REC: generator_type.id"
          bank_id: "REC: bank_a.id"
          biller_id: "REC: biller.id"
        method: "action_generate"
      - step: "Find the created VA generator"
        action: "search"
        model: "va_generator"
        domain:
          - ["biller_id", "=", "REC: biller.id"]
        save_as: "generator"
        expect_count: 1
      - step: "Assert VA generator values"
        action: "assert"
        target: "generator"
        asserts:
          state:
            type: "value"
            expected: "draft"
          type_id:
            type: "m2o"
            expected: "REC: generator_type"
          biller_id:
            type: "m2o"
            expected: "REC: biller"
      - step: "Find the source data line"
        action: "search"
        model: "va_generator.source_data"
        domain:
          - ["va_generator_id", "=", "REC: generator.id"]
        save_as: "source_line"
        expect_count: 1
      - step: "Assert source data line resolves to the partner"
        action: "assert"
        target: "source_line"
        asserts:
          model_id:
            type: "m2o"
            expected: "REC: model_res_partner"
          res_id:
            type: "value"
            expected: "REC: partner.id"

  - name:
      "Wizard on three selected partners creates one va_generator with three source data
      lines"
    steps:
      - step: "Create generator type"
        action: "create"
        model: "va_generator_type"
        save_as: "generator_type"
        values:
          name: "Sequence Based"
          code: "/"
          python_code: 'result = "U1"'
      - step: "Create biller"
        action: "create"
        model: "va_biller"
        save_as: "biller"
        values:
          name: "Biller A"
          code: "/"
      - step: "Create partner 1"
        action: "create"
        model: "res.partner"
        save_as: "partner_1"
        values:
          name: "Test Partner 1"
      - step: "Create partner 2"
        action: "create"
        model: "res.partner"
        save_as: "partner_2"
        values:
          name: "Test Partner 2"
      - step: "Create partner 3"
        action: "create"
        model: "res.partner"
        save_as: "partner_3"
        values:
          name: "Test Partner 3"
      - step:
          "Gather the three partners into one recordset (mimics a multi-row list
          selection)"
        action: "search"
        model: "res.partner"
        domain:
          - [
              "id",
              "in",
              ["REC: partner_1.id", "REC: partner_2.id", "REC: partner_3.id"],
            ]
        save_as: "partners_3"
        expect_count: 3
      - step:
          "Run wizard on all three partners at once (same action as the single-partner
          case)"
        action: "wizard"
        model: "generate_va"
        target: "partners_3"
        values:
          type_id: "REC: generator_type.id"
          bank_id: "REC: bank_a.id"
          biller_id: "REC: biller.id"
        method: "action_generate"
      - step: "Exactly one VA generator was created"
        action: "search"
        model: "va_generator"
        domain:
          - ["biller_id", "=", "REC: biller.id"]
        save_as: "generator"
        expect_count: 1
      - step: "Exactly three source data lines were created on it"
        action: "search"
        model: "va_generator.source_data"
        domain:
          - ["va_generator_id", "=", "REC: generator.id"]
        save_as: "source_lines"
        expect_count: 3

  - name: "Wizard with merchant selected fills the generator's merchant_id"
    steps:
      - step: "Create generator type"
        action: "create"
        model: "va_generator_type"
        save_as: "generator_type"
        values:
          name: "Sequence Based"
          code: "/"
          python_code: 'result = "U1"'
      - step: "Create biller"
        action: "create"
        model: "va_biller"
        save_as: "biller"
        values:
          name: "Biller A"
          code: "/"
      - step: "Create bank code for the biller"
        action: "create"
        model: "va_biller.code"
        save_as: "biller_code"
        values:
          va_biller_id: "REC: biller.id"
          bank_id: "REC: bank_a.id"
          biller_code: "B1"
      - step: "Create merchant registered under the biller"
        action: "create"
        model: "va_biller_merchant"
        save_as: "merchant"
        values:
          name: "Merchant A"
          code: "/"
          biller_code_ids:
            - - 0
              - 0
              - biller_id: "REC: biller_code.id"
                merchant_code: "M1"
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Partner"
      - step: "Run wizard with biller and merchant selected"
        action: "wizard"
        model: "generate_va"
        target: "partner"
        values:
          type_id: "REC: generator_type.id"
          bank_id: "REC: bank_a.id"
          biller_id: "REC: biller.id"
          merchant_id: "REC: merchant.id"
        method: "action_generate"
      - step: "Find the created VA generator"
        action: "search"
        model: "va_generator"
        domain:
          - ["biller_id", "=", "REC: biller.id"]
        save_as: "generator"
        expect_count: 1
      - step: "Assert merchant_id was carried over from the wizard"
        action: "assert"
        target: "generator"
        asserts:
          merchant_id:
            type: "m2o"
            expected: "REC: merchant"

  - name: "Wizard with usage_id selected fills the generator's usage_id"
    steps:
      - step: "Create generator type"
        action: "create"
        model: "va_generator_type"
        save_as: "generator_type"
        values:
          name: "Sequence Based"
          code: "/"
          python_code: 'result = "U1"'
      - step: "Create biller"
        action: "create"
        model: "va_biller"
        save_as: "biller"
        values:
          name: "Biller A"
          code: "/"
      - step: "Create bank account usage"
        action: "create"
        model: "res_partner_bank_usage"
        save_as: "usage"
        values:
          name: "Invoice Collection"
          code: "/"
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Partner"
      - step: "Run wizard with usage_id selected"
        action: "wizard"
        model: "generate_va"
        target: "partner"
        values:
          type_id: "REC: generator_type.id"
          bank_id: "REC: bank_a.id"
          biller_id: "REC: biller.id"
          usage_id: "REC: usage.id"
        method: "action_generate"
      - step: "Find the created VA generator"
        action: "search"
        model: "va_generator"
        domain:
          - ["biller_id", "=", "REC: biller.id"]
        save_as: "generator"
        expect_count: 1
      - step: "Assert usage_id was carried over from the wizard"
        action: "assert"
        target: "generator"
        asserts:
          usage_id:
            type: "m2o"
            expected: "REC: usage"

  - name: "Wizard without usage_id leaves the generator's usage_id empty"
    steps:
      - step: "Create generator type"
        action: "create"
        model: "va_generator_type"
        save_as: "generator_type"
        values:
          name: "Sequence Based"
          code: "/"
          python_code: 'result = "U1"'
      - step: "Create biller"
        action: "create"
        model: "va_biller"
        save_as: "biller"
        values:
          name: "Biller A"
          code: "/"
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Partner"
      - step: "Run wizard without selecting usage_id"
        action: "wizard"
        model: "generate_va"
        target: "partner"
        values:
          type_id: "REC: generator_type.id"
          bank_id: "REC: bank_a.id"
          biller_id: "REC: biller.id"
        method: "action_generate"
      - step: "Find the created VA generator"
        action: "search"
        model: "va_generator"
        domain:
          - ["biller_id", "=", "REC: biller.id"]
        save_as: "generator"
        expect_count: 1
      - step: "Assert usage_id is empty"
        action: "assert"
        target: "generator"
        asserts:
          usage_id:
            type: "value"
            operator: "is_falsy"

  - name: "Wizard with exporter_id selected fills the generator's exporter_id"
    steps:
      - step: "Create generator type"
        action: "create"
        model: "va_generator_type"
        save_as: "generator_type"
        values:
          name: "Sequence Based"
          code: "/"
          python_code: 'result = "U1"'
      - step: "Create biller"
        action: "create"
        model: "va_biller"
        save_as: "biller"
        values:
          name: "Biller A"
          code: "/"
      - step: "Create exporter"
        action: "create"
        model: "va_generator_exporter"
        save_as: "exporter"
        values:
          name: "Bank ABC VA Export"
          code: "/"
          python_code: 'result = [["VA", "Name"]]'
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Partner"
      - step: "Run wizard with exporter_id selected"
        action: "wizard"
        model: "generate_va"
        target: "partner"
        values:
          type_id: "REC: generator_type.id"
          bank_id: "REC: bank_a.id"
          biller_id: "REC: biller.id"
          exporter_id: "REC: exporter.id"
        method: "action_generate"
      - step: "Find the created VA generator"
        action: "search"
        model: "va_generator"
        domain:
          - ["biller_id", "=", "REC: biller.id"]
        save_as: "generator"
        expect_count: 1
      - step: "Assert exporter_id was carried over from the wizard"
        action: "assert"
        target: "generator"
        asserts:
          exporter_id:
            type: "m2o"
            expected: "REC: exporter"

  - name: "Wizard without exporter_id leaves the generator's exporter_id empty"
    steps:
      - step: "Create generator type"
        action: "create"
        model: "va_generator_type"
        save_as: "generator_type"
        values:
          name: "Sequence Based"
          code: "/"
          python_code: 'result = "U1"'
      - step: "Create biller"
        action: "create"
        model: "va_biller"
        save_as: "biller"
        values:
          name: "Biller A"
          code: "/"
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Partner"
      - step: "Run wizard without selecting exporter_id"
        action: "wizard"
        model: "generate_va"
        target: "partner"
        values:
          type_id: "REC: generator_type.id"
          bank_id: "REC: bank_a.id"
          biller_id: "REC: biller.id"
        method: "action_generate"
      - step: "Find the created VA generator"
        action: "search"
        model: "va_generator"
        domain:
          - ["biller_id", "=", "REC: biller.id"]
        save_as: "generator"
        expect_count: 1
      - step: "Assert exporter_id is empty"
        action: "assert"
        target: "generator"
        asserts:
          exporter_id:
            type: "value"
            operator: "is_falsy"

  - name:
      "Wizard on a res.users record with a generator type restricted to res.users
      succeeds"
    steps:
      - step: "Get ir.model record for res.users"
        action: "ref"
        xml_id: "base.model_res_users"
        save_as: "model_res_users"
      - step: "Create generator type restricted to res.users"
        action: "create"
        model: "va_generator_type"
        save_as: "generator_type_users"
        values:
          name: "Sequence Based (Users)"
          code: "/"
          python_code: 'result = "U1"'
          model_id: "REC: model_res_users.id"
      - step: "Create biller"
        action: "create"
        model: "va_biller"
        save_as: "biller_users"
        values:
          name: "Biller Users"
          code: "/"
      - step: "Get admin user as the source record"
        action: "ref"
        xml_id: "base.user_admin"
        save_as: "user_admin"
      - step: "Run wizard on the admin user (as if launched from the Users list)"
        action: "wizard"
        model: "generate_va"
        target: "user_admin"
        values:
          type_id: "REC: generator_type_users.id"
          bank_id: "REC: bank_a.id"
          biller_id: "REC: biller_users.id"
        method: "action_generate"
      - step: "Find the created VA generator"
        action: "search"
        model: "va_generator"
        domain:
          - ["biller_id", "=", "REC: biller_users.id"]
        save_as: "generator_users"
        expect_count: 1
      - step: "Find the source data line"
        action: "search"
        model: "va_generator.source_data"
        domain:
          - ["va_generator_id", "=", "REC: generator_users.id"]
        save_as: "source_line_users"
        expect_count: 1
      - step: "Assert source data line resolves to the admin user"
        action: "assert"
        target: "source_line_users"
        asserts:
          model_id:
            type: "m2o"
            expected: "REC: model_res_users"
          model_name:
            type: "value"
            expected: "res.users"
          res_id:
            type: "value"
            expected: "REC: user_admin.id"

  - name: "Wizard on a res.users record with an unrestricted generator type is accepted"
    steps:
      - step: "Create unrestricted generator type"
        action: "create"
        model: "va_generator_type"
        save_as: "generator_type_open"
        values:
          name: "Sequence Based (Open)"
          code: "/"
          python_code: 'result = "U1"'
      - step: "Create biller"
        action: "create"
        model: "va_biller"
        save_as: "biller_open"
        values:
          name: "Biller Open"
          code: "/"
      - step: "Get admin user as the source record"
        action: "ref"
        xml_id: "base.user_admin"
        save_as: "user_admin_open"
      - step: "Run wizard on the admin user with an unrestricted type"
        action: "wizard"
        model: "generate_va"
        target: "user_admin_open"
        values:
          type_id: "REC: generator_type_open.id"
          bank_id: "REC: bank_a.id"
          biller_id: "REC: biller_open.id"
        method: "action_generate"
      - step: "Exactly one VA generator was created"
        action: "search"
        model: "va_generator"
        domain:
          - ["biller_id", "=", "REC: biller_open.id"]
        save_as: "generator_open"
        expect_count: 1

  - name:
      "Wizard from res.partner using a generator type restricted to a different model is
      rejected"
    steps:
      - step: "Get ir.model record for res.users"
        action: "ref"
        xml_id: "base.model_res_users"
        save_as: "model_res_users_2"
      - step: "Create generator type restricted to res.users"
        action: "create"
        model: "va_generator_type"
        save_as: "generator_type_restricted"
        values:
          name: "Sequence Based (Users Only)"
          code: "/"
          python_code: 'result = "U1"'
          model_id: "REC: model_res_users_2.id"
      - step: "Create biller"
        action: "create"
        model: "va_biller"
        save_as: "biller_mismatch"
        values:
          name: "Biller Mismatch"
          code: "/"
      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_mismatch"
        values:
          name: "Test Partner Mismatch"
      - step: "Wizard on the partner with a type restricted to res.users must fail"
        action: "wizard"
        model: "generate_va"
        target: "partner_mismatch"
        as_user: "base.user_admin"
        values:
          type_id: "REC: generator_type_restricted.id"
          bank_id: "REC: bank_a.id"
          biller_id: "REC: biller_mismatch.id"
        method: "action_generate"
        expect_error:
          type: "UserError"
          message_contains: "is restricted to model res.users"

  - name: "Generating without an active_model/active_ids context is rejected"
    steps:
      - step: "Create generator type"
        action: "create"
        model: "va_generator_type"
        save_as: "generator_type"
        values:
          name: "Sequence Based"
          code: "/"
          python_code: 'result = "U1"'
      - step: "Create biller"
        action: "create"
        model: "va_biller"
        save_as: "biller"
        values:
          name: "Biller A"
          code: "/"
      - step: "Create wizard directly (no active_model/active_ids context)"
        action: "create"
        model: "generate_va"
        save_as: "wizard"
        values:
          type_id: "REC: generator_type.id"
          bank_id: "REC: bank_a.id"
          biller_id: "REC: biller.id"
      - step: "action_generate must fail because no active_model context was set"
        action: "call"
        target: "wizard"
        method: "action_generate"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "No source model could be resolved"
