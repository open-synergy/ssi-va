          model_id: "REC: model_res_partner.id"
          res_id: "REC: partner.id"
      - step: "Assert generator is still in draft, with no bank account yet"
        action: "assert"
        target: "generator"
        asserts:
          state:
            type: "value"
            expected: "draft"
          bank_account_ids:
            type: "o2m"
            check: "count"
            expected_count: 0
      - step: "Create a cancel reason"
        action: "create"
        model: "base.cancel_reason"
        save_as: "reason"
        values:
          name: "Test VA Generator Cancel Reason (draft)"
          code: "/"
      - step: "Cancel from draft through the reason wizard"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "generator"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: reason"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"

  - name: "Cancelling from confirm succeeds without error and creates no bank account"
    steps:
