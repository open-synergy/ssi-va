            - - 0
              - 0
              - biller_id: "REC: biller_code.id"
                merchant_code: "M1"
      - step: "Create VA generator with merchant"
        action: "create"
        model: "va_generator"
        save_as: "generator"
        as_user: "base.user_admin"
        values:
          type_id: "REC: generator_type.id"
          bank_id: "REC: bank_a.id"
          biller_id: "REC: biller.id"
          merchant_id: "REC: merchant.id"
      - step: "Add source data for the partner"
        action: "create"
        model: "va_generator.source_data"
        values:
          va_generator_id: "REC: generator.id"
          model_id: "REC: model_res_partner.id"
          res_id: "REC: partner.id"
      - step: "Confirm VA generator"
        action: "call"
        target: "generator"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve VA generator, which triggers action_done"
        action: "call"
        target: "generator"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"
      - step: "Find generated bank account"
        action: "search"
        model: "res.partner.bank"
        domain:
          - ["va_generator_id", "=", "REC: generator.id"]
        save_as: "bank_account"
        expect_count: 1
      - step: "Assert generated bank account includes the merchant code"
        action: "assert"
        target: "bank_account"
        asserts:
          acc_number:
            type: "value"
            expected: "B1M1U1"
          partner_id:
            type: "m2o"
            expected: "REC: partner"

  - name:
      "Full workflow at merchant level uses only the merchant code matching the selected
      bank, even when the merchant has codes at another bank too"
    steps:
      - step: "Create generator type"
        action: "create"
        model: "va_generator_type"
        save_as: "generator_type"
        values:
          name: "Sequence Based"
          code: "/"
          python_code: 'result = "U41"'
      - step: "Create biller"
